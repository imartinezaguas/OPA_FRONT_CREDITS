<div class="layout-container d-flex">
  <!-- Menú Lateral -->
  <aside class="sidebar d-flex">
    <div class="sidebar-top">
      <div class="brand d-flex align-center gap-2" style="margin-bottom: 32px;">
        <div class="logo-icon">P</div>
        <div>
          <strong>Provisión</strong>
          <span>Crédito solidario</span>
        </div>
      </div>

      <nav>
        <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
          <span class="icon">📊</span> Panel
        </a>
        <a routerLink="/solicitudes" routerLinkActive="active" class="nav-item">
          <span class="icon">📄</span> Solicitudes
        </a>
      </nav>
    </div>

    <div class="sidebar-bottom">
      <div class="session-info">
        <p class="session-label">SESIÓN LOCAL</p>
        <strong>María Restrepo</strong>
        <span>Coordinación de cartera</span>
      </div>
      <button class="logout-btn" (click)="prepararLogout()">
        Cerrar sesión
      </button>
    </div>
  </aside>

  <!-- Área Principal de Contenido -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>

<!-- Modal Confirmación Cerrar Sesión -->
@if (isLogoutModalOpen()) {
  <div class="modal-overlay">
    <div class="modal-content text-center" style="max-width: 400px;">
      <div class="warning-icon-svg">
        <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#D32F2F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </div>
      <h4 class="text-danger" style="margin-bottom: 8px;">¿Cerrar Sesión?</h4>
      <p>Vas a salir de tu cuenta y tendrás que volver a iniciar sesión para acceder al panel.</p>
      
      <div class="d-flex justify-center gap-3 mt-3">
        <button class="btn-outline" (click)="cancelarLogout()">Permanecer</button>
        <button class="btn-primary btn-danger" (click)="ejecutarLogout()">Sí, cerrar sesión</button>
      </div>
    </div>
  </div>
}
